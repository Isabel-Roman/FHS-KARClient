plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'us.dit'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenLocal()
	mavenCentral()
}
ext {
    hapiFhirVersion = '8.12.0'
}
// msbpmn usa javax.xml.bind: evita que el BOM de Spring Boot suba jaxb-runtime a 4.x (jakarta)
ext['glassfish-jaxb.version'] = '2.3.9'

dependencies {
// Source: https://mvnrepository.com/artifact/org.jgrapht/jgrapht-core
	implementation("org.jgrapht:jgrapht-core:1.5.3")
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// HAPI FHIR Client Core & Estructuras R4
    implementation "ca.uhn.hapi.fhir:hapi-fhir-base:${hapiFhirVersion}"
    implementation "ca.uhn.hapi.fhir:hapi-fhir-client:${hapiFhirVersion}"
    implementation "ca.uhn.hapi.fhir:hapi-fhir-structures-r4:${hapiFhirVersion}"
	//Para editar modelos (flowable)
	// Source: https://mvnrepository.com/artifact/org.flowable/flowable-bpmn-model
	implementation 'org.flowable:flowable-bpmn-model:8.0.0'
	// Source: https://mvnrepository.com/artifact/org.flowable/flowable-bpmn-converter
	implementation 'org.flowable:flowable-bpmn-converter:8.0.0'
	// Para generar automáticamente el diagrama (BPMNDI) del proceso
	implementation 'org.flowable:flowable-bpmn-layout:8.0.0'
}

tasks.named('test') {
	useJUnitPlatform()
}
